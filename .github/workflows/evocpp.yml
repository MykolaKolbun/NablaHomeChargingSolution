name: EVOCPP — build and deploy

on:
  push:
    branches: [master]
    paths:
      - "EVOCPP/OCPPServer/**"
      - "deploy/**"
      - ".github/workflows/evocpp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-evocpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./EVOCPP/OCPPServer
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/mykolakolbun/nablahome-evocpp:latest
            ghcr.io/mykolakolbun/nablahome-evocpp:${{ github.sha }}
          cache-from: type=gha,scope=evocpp
          cache-to: type=gha,scope=evocpp,mode=max

      - name: Install cloudflared
        run: |
          curl -L https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt update && sudo apt install cloudflared -y

      - name: Configure SSH to Pi
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << EOF
          Host ${{ secrets.PI_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
          EOF

      - name: Upload compose file and secrets
        env:
          HOME_DB_PASSWORD:        ${{ secrets.HOME_DB_PASSWORD }}
          HOME_RABBITMQ_PASSWORD:  ${{ secrets.HOME_RABBITMQ_PASSWORD }}
          HOME_TRACE_DOWNLOAD_KEY: ${{ secrets.HOME_TRACE_DOWNLOAD_KEY }}
        run: |
          PI="${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}"
          ssh "$PI" "mkdir -p ~/NablaHome"
          scp -F ~/.ssh/config deploy/docker-compose.yml "$PI":~/NablaHome/docker-compose.yml
          # Secrets: GitHub Secrets → env → stdin → ~/NablaHome/.env (never in command args).
          # Upsert per key so values added manually on the Pi are preserved.
          printf "HOME_DB_PASSWORD=%s\nHOME_RABBITMQ_PASSWORD=%s\nHOME_TRACE_DOWNLOAD_KEY=%s\n" \
            "$HOME_DB_PASSWORD" "$HOME_RABBITMQ_PASSWORD" "$HOME_TRACE_DOWNLOAD_KEY" | \
            ssh "$PI" '
              touch ~/NablaHome/.env && chmod 600 ~/NablaHome/.env
              while IFS= read -r line; do
                key="${line%%=*}"
                sed -i "/^${key}=/d" ~/NablaHome/.env
                echo "$line" >> ~/NablaHome/.env
              done
            '

      - name: Deploy evocpp
        run: |
          ssh "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}" "
            cd ~/NablaHome &&
            docker compose pull evocpp &&
            docker compose up -d evocpp &&
            sleep 15 &&
            docker compose ps
          "
